server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    resolver [fd12::10] valid=10s;

    location /api/ {
        # A variable in proxy_pass makes nginx re-resolve the name at request time via
        # `resolver` above (a literal hostname is resolved once at startup and the IP is cached
        # forever, so after the backend redeploys nginx keeps hitting the old address -> 504).
        set $backend "hackaton26.railway.internal";
        proxy_pass http://$backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
